<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Экологическое состояние Гомельской области: карта проблемных территорий, качество воздуха, предприятия, реки и обращения жителей."
    />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Тема до загрузки React (то же, что lib/theme.ts): без вспышки светлой страницы в тёмной теме
      try {
        var theme = localStorage.getItem("theme")
        if (theme === "dark" || (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark")
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#18181b")
        }
      } catch (e) {}
      // Заглушка первого экрана (ниже): тёмная панель карты — только на главной
      if (location.pathname === "/") {
        document.documentElement.setAttribute("data-home", "")
        // Данные первого экрана — одним запросом и сразу, пока качается JS (src/api/home.ts)
        window.__ecoHome = fetch("/api/eco/home")
          .then(function (r) {
            return r.ok ? r.json() : null
          })
          .catch(function () {
            return null
          })
      }
    </script>
    <!-- Заглушка до загрузки JS: шапка и панель карты рисуются сразу, из HTML (на 3G до React — секунды белого
         экрана). Размеры и цвета — как у SiteHeader и MapSection (tokens.css); React при старте заменяет её -->
    <style>
      body {
        margin: 0;
        background: #fff;
      }
      html.dark body {
        background: #18181b;
      }
      .shell {
        font:
          600 16px/1.6 system-ui,
          sans-serif;
        letter-spacing: -0.02em;
        color: #121413;
      }
      html.dark .shell {
        color: #f4f4f5;
      }
      .shell-bar {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 56px;
        padding: 0 16px;
        border-bottom: 1px solid #ececea;
      }
      html.dark .shell-bar {
        border-color: #2a2a2e;
      }
      .shell-logo {
        width: 24px;
        height: 24px;
        border-radius: 6px;
        background: currentColor;
      }
      .shell-map {
        display: none;
        margin: 12px 12px 0;
        padding: 12px;
        border-radius: 16px;
        background: #0f0f11;
      }
      [data-home] .shell-map {
        display: block;
      }
      .shell-map div {
        height: calc(100svh - 56px - 48px);
        border: 1px solid #232326;
        border-radius: 12px;
        background: #151517;
        box-sizing: border-box;
      }
      @media (min-width: 768px) {
        .shell-bar {
          padding: 0 40px;
        }
        .shell-map {
          margin: 16px 16px 0;
          padding: 16px;
        }
        .shell-map div {
          height: calc(100svh - 56px - 64px);
        }
      }
      @media (min-width: 1024px) {
        .shell-map {
          padding: 0;
          background: none;
        }
        .shell-map div {
          height: max(640px, calc(100svh - 56px - 32px));
          border-radius: 16px;
        }
      }
    </style>
    <!-- Карточка ссылки в мессенджерах. og:url и og:image — после выбора домена (CLAUDE.md §16, вопрос 5) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:site_name" content="Экология Гомельской области" />
    <meta property="og:title" content="Экологический профиль Гомельщины" />
    <meta
      property="og:description"
      content="Экологическое состояние Гомельской области: карта проблемных территорий, качество воздуха, предприятия, реки и обращения жителей."
    />
    <meta name="twitter:card" content="summary" />
    <title>Экологический профиль Гомельщины</title>
  </head>
  <body>
    <div id="root">
      <div class="shell" aria-hidden="true">
        <div class="shell-bar"><span class="shell-logo"></span>Экология Гомельской области</div>
        <div class="shell-map"><div></div></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
