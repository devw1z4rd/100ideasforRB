<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Экологическое состояние Гомельской области: карта проблемных территорий, качество воздуха, предприятия, реки и обращения жителей."
    />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Keep the shell and the locale read by src/lib/locale.ts in sync.
      var pageLocale = new URLSearchParams(location.search).get("lang")
      if (pageLocale !== "be" && pageLocale !== "ru") {
        try {
          pageLocale = localStorage.getItem("eco-locale")
        } catch (e) {}
      }
      if (pageLocale === "be") document.documentElement.lang = "be"

      // Apply the theme before React loads (same logic as lib/theme.ts) to avoid a light flash in dark mode
      try {
        var theme = localStorage.getItem("theme")
        if (theme === "dark" || (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark")
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#18181b")
        }
      } catch (e) {}
      if (location.pathname === "/") {
        document.documentElement.setAttribute("data-home", "")
        // First-screen data in one request while JS downloads (src/api/home.ts)
        window.__ecoHome = fetch("/api/eco/home")
          .then(function (r) {
            return r.ok ? r.json() : null
          })
          .catch(function () {
            return null
          })
      }
    </script>
    <!-- Static shell painted before JS loads (header, plus the dark map panel on the home page).
         Sizes and colors must match SiteHeader and MapSection; React replaces it on start. -->
    <style>
      /* Same as index.css: without it the long page's scrollbar appears with React and shifts the header */
      html {
        scrollbar-gutter: stable;
      }
      body {
        margin: 0;
        background: #fff;
      }
      html.dark body {
        background: #18181b;
      }
      .shell {
        font:
          600 16px/1.6 system-ui,
          sans-serif;
        letter-spacing: -0.02em;
        color: #121413;
      }
      html.dark .shell {
        color: #f4f4f5;
      }
      .shell-name[lang="be"],
      html[lang="be"] .shell-name[lang="ru"] {
        display: none;
      }
      html[lang="be"] .shell-name[lang="be"] {
        display: inline;
      }
      .shell-bar {
        border-bottom: 1px solid #ececea;
      }
      /* Container: 1600 px centered; box-sizing set explicitly, Tailwind's preflight lands mid-shell */
      .shell-in {
        display: flex;
        align-items: center;
        gap: 10px;
        box-sizing: border-box;
        max-width: 1600px;
        height: 56px;
        margin: 0 auto;
        padding: 0 16px;
      }
      html.dark .shell-bar {
        border-color: #2a2a2e;
      }
      .shell-logo {
        width: 24px;
        height: 24px;
        border-radius: 6px;
        background: currentColor;
      }
      .shell-map {
        display: none;
        margin: 12px 12px 0;
        padding: 12px;
        border-radius: 16px;
        background: #0f0f11;
      }
      [data-home] .shell-map {
        display: block;
      }
      .shell-map div {
        height: calc(100svh - 56px - 48px);
        border: 1px solid #232326;
        border-radius: 12px;
        background: #151517;
        box-sizing: border-box;
      }
      @media (min-width: 768px) {
        .shell-in {
          padding: 0 40px;
        }
        .shell-map {
          margin: 16px 16px 0;
          padding: 16px;
        }
        .shell-map div {
          height: calc(100svh - 56px - 64px);
        }
      }
      @media (min-width: 1024px) {
        .shell-map {
          padding: 0;
          background: none;
        }
        .shell-map div {
          height: max(640px, calc(100svh - 56px - 32px));
          border-radius: 16px;
        }
      }
    </style>
    <!-- __SITE_URL__ becomes VITE_SITE_URL at build time (socialMeta in vite.config.ts): previews want absolute URLs.
         No og:url: in an SPA every page would claim the home page's address. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:site_name" content="Экология Гомельской области" />
    <meta property="og:title" content="Экологический профиль Гомельщины" />
    <meta
      property="og:description"
      content="Экологическое состояние Гомельской области: карта проблемных территорий, качество воздуха, предприятия, реки и обращения жителей."
    />
    <meta property="og:image" content="__SITE_URL__/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Карта Гомельской области с районами и реками" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Экологический профиль Гомельщины</title>
    <script>
      if (document.documentElement.lang === "be") document.title = "Экалагічны профіль Гомельшчыны"
    </script>
  </head>
  <body>
    <div id="root">
      <div class="shell" aria-hidden="true">
        <div class="shell-bar">
          <div class="shell-in">
            <span class="shell-logo"></span>
            <span class="shell-name" lang="ru">Экология Гомельской области</span>
            <span class="shell-name" lang="be">Экалогія Гомельскай вобласці</span>
          </div>
        </div>
        <div class="shell-map"><div></div></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
